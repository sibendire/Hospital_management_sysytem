<!DOCTYPE html>

<html>

<head>

<title>Login</title>


<style>

body{

background:#667eea;

font-family:Arial;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}


.container{

background:white;

padding:30px;

border-radius:15px;

width:350px;

}


input{

width:100%;

padding:12px;

margin:10px 0;

}


button{

width:100%;

padding:12px;

background:#667eea;

color:white;

border:none;

}



</style>


</head>


<body>


<div class="container">


<h2>
Login
</h2>



<form method="POST">


{% csrf_token %}



<input 
type="text"
name="username"
placeholder="Username"
>



<input
type="password"
name="password"
placeholder="Password"
>


<button>
Login
</button>


</form>



</div>


</body>


</html>
