<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>New Laboratory Request</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow-lg">

<div class="card-header bg-primary text-white">

<h3>🧪 New Laboratory Request</h3>

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Patient</label>

{{ form.patient }}

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Laboratory Test</label>

{{ form.test }}

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Sample Number</label>

{{ form.sample_number }}

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Requested By</label>

{{ form.requested_by }}

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Status</label>

{{ form.status }}

</div>

</div>

<hr>

<button class="btn btn-success">

Save Laboratory Request

</button>

<a href="{% url 'laboratory_dashboard' %}" class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</body>
</html>
