<!DOCTYPE html>

<html>

<head>

<title>
Laboratory Dashboard
</title>


<link href="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


</head>


<body class="bg-light">


<div class="container mt-5">


<h2 class="mb-4">

🧪 Laboratory Dashboard

</h2>




<div class="row">


<div class="col-md-3">

<div class="card shadow p-3 text-center">


<h5>
Total Tests
</h5>

<h1 class="text-primary">

{{tests}}

</h1>


</div>

</div>





<div class="col-md-3">

<div class="card shadow p-3 text-center">

<h5>
Requests
</h5>

<h1>

{{requests}}

</h1>

</div>

</div>





<div class="col-md-3">

<div class="card shadow p-3 text-center">


<h5>
Pending
</h5>

<h1 class="text-warning">

{{pending}}

</h1>

</div>


</div>





<div class="col-md-3">


<div class="card shadow p-3 text-center">


<h5>
Completed
</h5>

<h1 class="text-success">

{{completed}}

</h1>


</div>


</div>



</div>





<hr>



<a href="{% url 'add_test' %}"
class="btn btn-primary">

Add Laboratory Test

</a>



<a href="{% url 'create_lab_request' %}"
class="btn btn-success">

New Lab Request

</a>



</div>


</body>

</html>
