<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Laboratory Test</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        body {

            background:#f4f7fb;

            font-family:"Segoe UI", Arial, sans-serif;

        }


        .card {

            border:none;

            border-radius:15px;

            box-shadow:0 5px 20px rgba(0,0,0,0.1);

        }


        .card-header {

            background:#0b5ed7;

            color:white;

            border-radius:15px 15px 0 0 !important;

            padding:20px;

        }


        label {

            font-weight:600;

            margin-bottom:5px;

            color:#444;

        }


        input, select, textarea {

            border-radius:8px !important;

            padding:12px !important;

        }


        .btn-save {

            background:#198754;

            color:white;

            padding:12px 30px;

            border-radius:8px;

            font-weight:bold;

        }


        .btn-save:hover {

            background:#146c43;

            color:white;

        }


        .btn-back {

            background:#6c757d;

            color:white;

            padding:12px 25px;

            border-radius:8px;

        }


    </style>


</head>


<body>


<div class="container mt-5">


    <div class="row justify-content-center">


        <div class="col-md-8">


            <div class="card">


                <div class="card-header">


                    <h3 class="mb-0">

                        🧪 Laboratory Test Registration

                    </h3>


                    <small>

                        Create a new laboratory service/test

                    </small>


                </div>



                <div class="card-body p-4">



                    {% if messages %}

                        {% for message in messages %}

                        <div class="alert alert-success">

                            {{ message }}

                        </div>

                        {% endfor %}

                    {% endif %}




                    <form method="POST">


                        {% csrf_token %}



                        <div class="row">



                            <div class="col-md-6 mb-3">


                                <label>
                                    Test Name
                                </label>


                                {{ form.name }}


                            </div>





                            <div class="col-md-6 mb-3">


                                <label>
                                    Category
                                </label>


                                {{ form.category }}


                            </div>






                            <div class="col-md-6 mb-3">


                                <label>
                                    Test Price
                                </label>


                                {{ form.price }}


                            </div>





                            <div class="col-md-12 mb-3">


                                <label>
                                    Description
                                </label>


                                {{ form.description }}


                            </div>



                        </div>




                        <div class="mt-4">


                            <button type="submit"
                                    class="btn btn-save">

                                💾 Save Laboratory Test

                            </button>



                            <a href="{% url 'test_list' %}"
                               class="btn btn-back ms-2">

                                Cancel

                            </a>


                        </div>



                    </form>



                </div>


            </div>


        </div>


    </div>


</div>


</body>

</html>
