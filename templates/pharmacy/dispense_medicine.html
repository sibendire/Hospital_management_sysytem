<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dispense Medicine | MediCare HMS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f7fb;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #1f2937;
        }

        .container-page {
            max-width: 1250px;
            margin: 35px auto;
        }

        .card-box {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0,0,0,.07);
            overflow: hidden;
        }

        .page-header {
            background: #123c69;
            color: white;
            padding: 25px 30px;
        }

        .page-header h2 {
            margin: 0;
            font-size: 24px;
        }

        .page-header p {
            margin-top: 5px;
            margin-bottom: 0;
            opacity: .85;
        }

        .form-section {
            padding: 25px 30px;
        }

        .section-title {
            color: #123c69;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e5e7eb;
        }

        .medicine-row {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .medicine-row select,
        .medicine-row input {
            height: 45px;
        }

        .btn-remove {
            height: 45px;
        }

        .total-box {
            background: #e7f6ee;
            border: 1px solid #b7e4ca;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .total-label {
            color: #146c43;
            font-size: 14px;
        }

        .grand-total {
            color: #123c69;
            font-size: 28px;
            font-weight: 700;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        .back-link {
            text-decoration: none;
            color: white;
        }

        .stock-info {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }

        @media(max-width: 768px) {

            .container-page {
                margin: 15px;
            }

            .form-section {
                padding: 20px 15px;
            }

            .page-header {
                padding: 20px;
            }

        }

    </style>

</head>

<body>


<div class="container container-page">

    <div class="card-box">


        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="page-header">

            <div class="d-flex justify-content-between align-items-center">

                <div>

                    <h2>
                        💉 Dispense Medicine
                    </h2>

                    <p>
                        Issue one or more medicines to a patient.
                    </p>

                </div>

                <a
                    href="{% url 'pharmacy_dashboard' %}"
                    class="btn btn-light"
                >
                    ← Dashboard
                </a>

            </div>

        </div>


        <!-- =================================================
             MESSAGES
        ================================================== -->

        {% if messages %}

            <div class="px-4 pt-4">

                {% for message in messages %}

                    <div
                        class="alert
                        {% if message.tags == 'error' %}
                            alert-danger
                        {% elif message.tags == 'success' %}
                            alert-success
                        {% else %}
                            alert-info
                        {% endif %}
                        alert-dismissible fade show"
                        role="alert"
                    >

                        {{ message }}

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                        ></button>

                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <!-- =================================================
             FORM
        ================================================== -->

        <form
            method="POST"
            id="dispenseForm"
        >

            {% csrf_token %}


            <div class="form-section">


                <!-- =================================================
                     PATIENT INFORMATION
                ================================================== -->

                <div class="section-title">

                    👤 Patient Information

                </div>


                <div class="row g-3 mb-4">

                    <div class="col-md-6">

                        <label
                            class="form-label fw-semibold"
                        >
                            Patient Name
                            <span class="text-danger">*</span>
                        </label>

                        <input
                            type="text"
                            name="patient_name"
                            class="form-control"
                            placeholder="Enter patient name"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label
                            class="form-label fw-semibold"
                        >
                            Patient Number
                        </label>

                        <input
                            type="text"
                            name="patient_number"
                            class="form-control"
                            placeholder="Enter patient number"
                        >

                    </div>

                </div>


                <!-- =================================================
                     MEDICINES
                ================================================== -->

                <div class="section-title">

                    💊 Medicines

                </div>


                <div id="medicineContainer">


                    <div class="medicine-row">

                        <div class="row g-3 align-items-end">


                            <!-- MEDICINE -->

                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Medicine
                                </label>

                                <select
                                    name="medicine_id[]"
                                    class="form-select medicine-select"
                                    required
                                >

                                    <option value="">
                                        -- Select Medicine --
                                    </option>

                                    {% for medicine in medicines %}

                                        <option
                                            value="{{ medicine.id }}"
                                            data-price="{{ medicine.unit_price }}"
                                            data-stock="{{ medicine.quantity }}"
                                        >

                                            {{ medicine.name }}

                                            {% if medicine.strength %}
                                                - {{ medicine.strength }}
                                            {% endif %}

                                            | Stock:
                                            {{ medicine.quantity }}

                                            | UGX
                                            {{ medicine.unit_price|floatformat:2 }}

                                        </option>

                                    {% empty %}

                                        <option value="">
                                            No medicines available
                                        </option>

                                    {% endfor %}

                                </select>

                                <div class="stock-info medicine-stock">
                                    Select a medicine to view stock.
                                </div>

                            </div>


                            <!-- QUANTITY -->

                            <div class="col-md-3">

                                <label class="form-label fw-semibold">
                                    Quantity
                                </label>

                                <input
                                    type="number"
                                    name="quantity[]"
                                    class="form-control quantity-input"
                                    min="1"
                                    value="1"
                                    required
                                >

                            </div>


                            <!-- REMOVE -->

                            <div class="col-md-3">

                                <button
                                    type="button"
                                    class="btn btn-outline-danger w-100 btn-remove"
                                    onclick="removeMedicine(this)"
                                >
                                    🗑 Remove
                                </button>

                            </div>


                        </div>

                    </div>

                </div>


                <!-- =================================================
                     ADD MEDICINE
                ================================================== -->

                <button
                    type="button"
                    class="btn btn-outline-primary mt-2"
                    onclick="addMedicine()"
                >
                    + Add Another Medicine
                </button>


                <!-- =================================================
                     TOTAL
                ================================================== -->

                <div class="total-box">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>

                            <div class="total-label">
                                Grand Total
                            </div>

                            <div class="grand-total">
                                UGX <span id="grandTotal">0.00</span>
                            </div>

                        </div>

                        <div>
                            💰
                        </div>

                    </div>

                </div>


                <!-- =================================================
                     SUBMIT
                ================================================== -->

                <div class="d-flex justify-content-end gap-2 mt-4">

                    <a
                        href="{% url 'medicine_sales' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn btn-success px-4"
                    >
                        💉 Dispense Medicine
                    </button>

                </div>


            </div>

        </form>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<script>


/* =========================================================
   ADD MEDICINE ROW
========================================================= */

function addMedicine() {

    const container =
        document.getElementById("medicineContainer");

    const firstRow =
        document.querySelector(".medicine-row");

    const newRow =
        firstRow.cloneNode(true);


    /* Reset select */

    const select =
        newRow.querySelector(".medicine-select");

    select.value = "";


    /* Reset quantity */

    const quantity =
        newRow.querySelector(".quantity-input");

    quantity.value = 1;


    /* Reset stock text */

    const stockInfo =
        newRow.querySelector(".medicine-stock");

    stockInfo.textContent =
        "Select a medicine to view stock.";


    container.appendChild(newRow);

    updateTotal();

}


/* =========================================================
   REMOVE MEDICINE
========================================================= */

function removeMedicine(button) {

    const rows =
        document.querySelectorAll(".medicine-row");


    if (rows.length <= 1) {

        alert(
            "At least one medicine is required."
        );

        return;
    }


    button.closest(".medicine-row").remove();

    updateTotal();

}


/* =========================================================
   UPDATE MEDICINE INFORMATION
========================================================= */

function updateMedicineInfo(row) {

    const select =
        row.querySelector(".medicine-select");

    const selectedOption =
        select.options[select.selectedIndex];


    const price =
        selectedOption.dataset.price || 0;

    const stock =
        selectedOption.dataset.stock || 0;


    const stockInfo =
        row.querySelector(".medicine-stock");


    if (select.value) {

        stockInfo.textContent =
            "Available stock: "
            + stock
            + " | Unit price: UGX "
            + parseFloat(price).toLocaleString(
                undefined,
                {
                    minimumFractionDigits: 2
                }
            );

    } else {

        stockInfo.textContent =
            "Select a medicine to view stock.";

    }


    updateTotal();

}


/* =========================================================
   CALCULATE TOTAL
========================================================= */

function updateTotal() {

    let total = 0;


    document
        .querySelectorAll(".medicine-row")
        .forEach(function(row) {


            const select =
                row.querySelector(".medicine-select");

            const quantity =
                row.querySelector(".quantity-input");


            if (!select || !quantity) {
                return;
            }


            const option =
                select.options[select.selectedIndex];


            const price =
                parseFloat(
                    option?.dataset.price || 0
                );


            const qty =
                parseInt(
                    quantity.value || 0
                );


            total += price * qty;

        });


    document.getElementById(
        "grandTotal"
    ).textContent = total.toLocaleString(
        undefined,
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}


/* =========================================================
   EVENTS
========================================================= */

document.addEventListener(
    "change",
    function(event) {

        if (
            event.target.classList.contains(
                "medicine-select"
            )
        ) {

            const row =
                event.target.closest(
                    ".medicine-row"
                );

            updateMedicineInfo(row);

        }

    }
);


document.addEventListener(
    "input",
    function(event) {

        if (
            event.target.classList.contains(
                "quantity-input"
            )
        ) {

            updateTotal();

        }

    }
);


/* =========================================================
   FORM VALIDATION
========================================================= */

document.getElementById(
    "dispenseForm"
).addEventListener(
    "submit",
    function(event) {


        const rows =
            document.querySelectorAll(
                ".medicine-row"
            );


        let valid = true;


        rows.forEach(function(row) {

            const select =
                row.querySelector(
                    ".medicine-select"
                );

            const quantity =
                row.querySelector(
                    ".quantity-input"
                );


            if (!select.value) {

                valid = false;

                return;

            }


            const option =
                select.options[
                    select.selectedIndex
                ];


            const stock =
                parseInt(
                    option.dataset.stock || 0
                );


            const qty =
                parseInt(
                    quantity.value || 0
                );


            if (qty <= 0 || qty > stock) {

                valid = false;

                alert(
                    "Requested quantity cannot exceed available stock."
                );

            }

        });


        if (!valid) {

            event.preventDefault();

        }

    }
);


/* Initial calculation */

updateTotal();


</script>

</body>

</html>
