<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cancel Sale | MediCare HMS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow border-0 mx-auto"
         style="max-width: 600px;">

        <div class="card-body p-5 text-center">

            <div style="font-size:50px;">
                ⚠️
            </div>

            <h3 class="mt-3">
                Cancel Medicine Sale?
            </h3>

            <p class="text-muted">

                You are about to cancel the sale of

                <strong>
                    {{ sale.quantity }}
                    {{ sale.medicine.name }}
                </strong>

                for

                <strong>
                    {{ sale.patient_name }}
                </strong>.

            </p>

            <p class="text-danger">

                The medicine quantity will be returned to inventory.

            </p>


            <form method="POST">

                {% csrf_token %}

                <a
                    href="{% url 'sale_detail' sale.id %}"
                    class="btn btn-secondary"
                >
                    No, Go Back
                </a>

                <button
                    type="submit"
                    class="btn btn-danger"
                >
                    Yes, Cancel Sale
                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
